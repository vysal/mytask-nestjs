services:
  api:
    build:
      context: .
      target: production
    command:
      - sh
      - -c
      - npm run migration:run:prod && npm run start:prod
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DOCKER_POSTGRES_USER:-mytasks}
      DB_PASSWORD: ${DOCKER_POSTGRES_PASSWORD:-local-only-change-me}
      DB_DATABASE: ${DOCKER_POSTGRES_DB:-mytasks}
      DB_SSL: "false"
      JWT_SECRET: ${DOCKER_JWT_SECRET:-local-only-change-me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DOCKER_POSTGRES_USER:-mytasks}
      POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD:-local-only-change-me}
      POSTGRES_DB: ${DOCKER_POSTGRES_DB:-mytasks}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${DOCKER_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres_data:
